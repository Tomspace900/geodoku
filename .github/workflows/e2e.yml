name: E2E

# Playwright suite, run once per commit: on pushes to develop (and PRs into
# develop). Never on main. A release PR develop → main has develop's head as
# its head commit, so the check run "Playwright e2e" of that push already sits
# on the PR's commit and satisfies main's required check: re-running the suite
# on the PR, then again on the merge commit (same tree, same develop Convex
# backend), only made each release wait ~20 min (#178).
#
# Runs against the existing "develop" Convex deployment (its URL, exposed in the
# client bundle anyway, lives in the repo variable VITE_CONVEX_URL). No deploy
# key, no seeding: develop is already seeded and its hourly cron keeps today's
# grid current. NB: e2e submits real guesses, so it adds noise to develop's
# stats/rarity — intended, it's the staging env.
# Requires repo variable VITE_CONVEX_URL = <develop Convex URL>.
#
# Skipped on Dependabot PRs: the suite writes real guesses into develop's
# Convex env, so a dependency bump would bruit the staging stats for nothing.
# The build itself stays covered — `quality` (ci.yml) runs check:bundle, which
# builds. The full suite runs anyway as soon as the bump is merged into develop.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Many pushes a day → keep only the latest run per branch/PR; cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The browsers come from Playwright's official image, whose tag must match the
  # installed @playwright/test exactly: read it from the lockfile, so a
  # Dependabot bump needs no edit here. Installing them on the runner took
  # ~50 s, and up to 6 min on a slow day (`--with-deps` goes through apt).
  playwright-version:
    name: Playwright version
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          version=$(sed -n "s/^  '@playwright\/test@\([0-9][0-9.]*\)':$/\1/p" pnpm-lock.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::@playwright/test introuvable dans pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    # Name required by main's ruleset: keep it.
    name: Playwright e2e
    needs: playwright-version
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # The runner's user, which owns the workspace (Playwright's recommended
      # setup for GitHub Actions); host IPC so Chromium doesn't run out of
      # shared memory.
      options: --user 1001 --ipc=host
    # The e2e suite shares the develop Convex env, so never run two at once.
    concurrency:
      group: e2e-develop
      cancel-in-progress: false
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Keep aligned with package.json#packageManager.
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Serve a production build in e2e (see playwright.config.ts webServer): the
      # dev server's on-the-fly ESM transform saturates the runner CPU and flakes
      # the latency-sensitive 9-cell fills. VITE_CONVEX_URL is inlined at build.
      - run: pnpm build
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
