name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Many pushes a day → keep only the latest run per branch/PR; cancel the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No-secrets gate: pre-commit checks plus design-system and bundle budgets.
  # Runs on every push to main/develop and on every PR into main/develop.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Keep aligned with package.json#packageManager.
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One copy of each package: two Radix Dialog copies (vaul kept the old
      # one) left the page unclickable after closing the result modal, and e2e
      # does not run on Dependabot PRs. Fix with `pnpm dedupe`.
      - run: pnpm dedupe --check
      - run: pnpm lint # biome check + tsc --noEmit
      - run: pnpm test # vitest
      - run: pnpm check:content
      - run: pnpm check:design-system
      # Files, exports and dependencies nobody uses (knip.jsonc).
      - run: pnpm check:dead-code
      - run: pnpm check:bundle
      - run: pnpm simulate:scheduling --seed=20260714
      - name: Check SemVer bump on PR to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git fetch origin main --depth=1
          BASE_VERSION=$(git show origin/main:package.json | node -e "const d = JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.version)")
          HEAD_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const parse = (v) => v.split('.').map(Number);
            const [a1, a2, a3] = parse(process.argv[1]);
            const [b1, b2, b3] = parse(process.argv[2]);
            const gt = b1 > a1 || (b1 === a1 && (b2 > a2 || (b2 === a2 && b3 > a3)));
            if (!gt) {
              console.error('Bump de version manquant avant merge sur main (' + process.argv[1] + ' -> ' + process.argv[2] + '). Lance : pnpm release patch|minor|major');
              process.exit(1);
            }
            console.log('✓ Version bump vérifié : ' + process.argv[1] + ' -> ' + process.argv[2]);
          " "$BASE_VERSION" "$HEAD_VERSION"

  # End-to-end suite, run against the existing "develop" Convex deployment (its
  # URL, exposed in the client bundle anyway, lives in the repo variable
  # VITE_CONVEX_URL). No deploy key, no seeding: develop is already seeded and
  # its hourly cron keeps today's grid current. NB: e2e submits real guesses, so
  # it adds noise to develop's stats/rarity — intended, it's the staging env.
  #
  # Runs on every push to develop and main, and on every PR into main/develop.
  # The workflow-level concurrency cancels superseded runs
  # so rapid develop pushes don't pile up.
  # Requires repo variable VITE_CONVEX_URL = <develop Convex URL>.
  #
  # Skipped on Dependabot PRs: the suite writes real guesses into develop's
  # Convex env, so a dependency bump would bruit the staging stats for nothing.
  # The build itself stays covered — `quality` runs check:bundle, which builds.
  # The full suite runs anyway as soon as the bump is merged into develop.
  e2e:
    name: Playwright e2e
    needs: quality
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The e2e suite shares the develop Convex env, so never run two at once.
    concurrency:
      group: e2e-develop
      cancel-in-progress: false
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Keep aligned with package.json#packageManager.
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Serve a production build in e2e (see playwright.config.ts webServer): the
      # dev server's on-the-fly ESM transform saturates the runner CPU and flakes
      # the latency-sensitive 9-cell fills. VITE_CONVEX_URL is inlined at build.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
